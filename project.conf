# Antharchy project constants.
#
# These values appear in several shipped files -- the pacman channel
# templates, omarchy-version-channel's parser, omarchy-update-keyring, the
# generated os-release. Rather than repeat them and let copies drift, overlay
# files carry @@TOKEN@@ placeholders and apply-overlay.sh substitutes from
# here while materializing the tree.
#
# Adding a constant: define it here, use @@NAME@@ in an overlay file. The
# driver fails on any placeholder it cannot resolve, so a typo is a build
# error rather than a literal @@TYPO@@ shipped to users.

ANTHARCHY_NAME="Antharchy"
ANTHARCHY_ID="antharchy"

# Package repository host. Channel URLs are https://$DOMAIN/<channel>/$arch,
# which keeps the pacman Server line and the rclone layout the same shape as
# upstream's. Set in Phase 0; changing it means rebuilding the packages.
ANTHARCHY_DOMAIN="antharchy.anthus.ai"

# Project URLs.
ANTHARCHY_URL="https://github.com/AnthusAI/antharchy"
ANTHARCHY_SUPPORT_URL="https://github.com/AnthusAI/antharchy/discussions"
ANTHARCHY_BUG_URL="https://github.com/AnthusAI/antharchy/issues"

# Tokyo Night red, matching the branding.
ANTHARCHY_ANSI_COLOR="38;2;240;113;120"

# Package signing key fingerprint, 40 hex chars, no spaces.
#
# NOT YET GENERATED -- this lands in Phase 3 when the build host and key are
# created. Until then apply-overlay.sh substitutes the literal below and
# omarchy-update-keyring will refuse to run rather than trusting a wrong key.
# See docs/architecture.md.
ANTHARCHY_KEY_FPR="UNSET-PENDING-PHASE-3"

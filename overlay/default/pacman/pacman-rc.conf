# See the pacman.conf(5) manpage for option and repository directives

[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm

# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# pacman searches repositories in the order defined here

# ── Arch Linux ARM base ──────────────────────────────────────────────────────
# Antharchy runs no Arch mirror of its own. aarch64 systems take core/extra
# from Arch Linux ARM; [alarm] and [aur] are ALARM's own supplementary repos.
# There is no [multilib] on aarch64.
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist

# ── Antharchy ────────────────────────────────────────────────────────────────
# Listed after the base repos but before any third-party repo a user adds, so
# our build of a package that also exists upstream wins. The channel is
# encoded in this URL and nowhere else -- omarchy-version-channel parses this
# exact line to report which channel the system is on.
#
# Upstream's own package repository is deliberately absent on aarch64: it
# publishes no ARM tree (both its stable and edge channels return 404). On
# x86_64 it is included as an input repo so the omacom applications come for
# free -- see docs/overlay.md.
[antharchy]
Server = https://@@ANTHARCHY_DOMAIN@@/rc/$arch
